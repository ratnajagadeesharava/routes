name: Build Project

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (for example)
        uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build
